  <text class="t" x="958" y="838">Agent Lifecycle: Versions,</text>
  <text class="t" x="958" y="876">Quotas &amp; Retirement</text>
  <text class="s" x="958" y="940">a lifecycle for versions</text>

  <rect class="green" x="1412" y="720" width="446" height="260" rx="20"/>
  <text class="num" x="1444" y="784">07</text>
  <text class="t" x="1444" y="838">Responsible AI:</text>
  <text class="t" x="1444" y="876">Fairness Probes &amp; Audit</text>
  <text class="s" x="1444" y="940">a fairness and audit practice</text>
</svg>
