<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The audit trail of one submission, tied to the agent version that answered</title>
  <desc>Left, the Foundry agent version m8-rai-reviewer version 1 with the metadata prompt_version review-prompt-v1 and the model deployment gpt-5.4; agent_id is m8-rai-reviewer-v1, and every call names version 1 in its agent_reference. Middle, out/audit.jsonl holds one JSON line per review call. The three entries of correlation_id sub-aa5d8dfb: junior with agent_id m8-rai-reviewer-v1, input_hash 519b61d12d30330a and quality_score 12; senior with input_hash 3e1fcc277a09bd76 and quality_score 14; anonymized with input_hash 6294d8c1560d85fd and quality_score 12. A different header gives a different input_hash. Right, audit_report.py reads the log only, with no call to Foundry, and answers three questions: the version timeline from agent_id, model_version and prompt_version; scores by team context from output.team_context; the trail of one submission from correlation_id.</desc>
  <style>
    .h { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #24292f; }
    .hs { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #24292f; }
    .b { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 26px; fill: #57606a; }
    .c { font-family: Consolas, 'Courier New', monospace; font-size: 26px; fill: #24292f; }
    .line { stroke: #8c959f; stroke-width: 2; fill: none; }
    .purple { fill: #f3edff; stroke: #8c959f; stroke-width: 2; }
    .blue { fill: #eaf2ff; stroke: #8c959f; stroke-width: 2; }
    .green { fill: #e9f7ef; stroke: #8c959f; stroke-width: 2; }
    .white { fill: #ffffff; stroke: #8c959f; stroke-width: 2; }
  </style>
  <defs>
    <marker id="t-ah" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect class="purple" x="60" y="200" width="380" height="560" rx="18"/>
  <text class="h" x="90" y="255">agent version</text>
  <text class="c" x="90" y="300">m8-rai-reviewer</text>
  <text class="b" x="90" y="340">version 1</text>
  <text class="b" x="90" y="410">metadata:</text>
  <text class="c" x="90" y="450">prompt_version:</text>
  <text class="c" x="90" y="488">review-prompt-v1</text>
  <text class="b" x="90" y="558">model deployment:</text>
  <text class="c" x="90" y="598">gpt-5.4</text>
  <text class="b" x="90" y="668">agent_id:</text>
  <text class="c" x="90" y="706">m8-rai-reviewer-v1</text>
  <text class="b" x="60" y="812">every call names version 1</text>
  <text class="b" x="60" y="848">in its agent_reference</text>

  <path class="line" d="M440 480 H598" marker-end="url(#t-ah)"/>

  <rect class="blue" x="600" y="100" width="700" height="880" rx="20"/>
  <text class="c" x="630" y="155" font-weight="700">out/audit.jsonl</text>
  <text class="b" x="630" y="197">one JSON line per review call</text>
  <text class="c" x="630" y="250">correlation_id sub-aa5d8dfb</text>

  <rect class="white" x="630" y="280" width="640" height="190" rx="14"/>
  <text class="h" x="660" y="325">junior</text>
  <text class="c" x="660" y="370">agent_id: m8-rai-reviewer-v1</text>
  <text class="c" x="660" y="410">input_hash: 519b61d12d30330a</text>
  <text class="c" x="660" y="450">quality_score: 12</text>

  <rect class="white" x="630" y="495" width="640" height="190" rx="14"/>
  <text class="h" x="660" y="540">senior</text>
  <text class="c" x="660" y="585">agent_id: m8-rai-reviewer-v1</text>
  <text class="c" x="660" y="625">input_hash: 3e1fcc277a09bd76</text>
  <text class="c" x="660" y="665">quality_score: 14</text>

  <rect class="white" x="630" y="710" width="640" height="190" rx="14"/>
  <text class="h" x="660" y="755">anonymized</text>
  <text class="c" x="660" y="800">agent_id: m8-rai-reviewer-v1</text>
  <text class="c" x="660" y="840">input_hash: 6294d8c1560d85fd</text>
  <text class="c" x="660" y="880">quality_score: 12</text>

  <text class="b" x="630" y="945">a different header gives a different input_hash</text>

  <path class="line" d="M1300 480 H1438" marker-end="url(#t-ah)"/>

  <rect class="green" x="1440" y="160" width="420" height="670" rx="20"/>
  <text class="c" x="1470" y="215" font-weight="700">audit_report.py</text>
  <text class="b" x="1470" y="255">reads the log only,</text>
  <text class="b" x="1470" y="291">no call to Foundry</text>

  <rect class="white" x="1470" y="330" width="360" height="175" rx="14"/>
  <text class="hs" x="1495" y="372">version timeline</text>
  <text class="c" x="1495" y="412">agent_id,</text>
  <text class="c" x="1495" y="447">model_version,</text>
  <text class="c" x="1495" y="482">prompt_version</text>

  <rect class="white" x="1470" y="530" width="360" height="120" rx="14"/>
  <text class="hs" x="1495" y="572">scores by team context</text>
  <text class="c" x="1495" y="616">output.team_context</text>

  <rect class="white" x="1470" y="675" width="360" height="120" rx="14"/>
  <text class="hs" x="1495" y="717">trail of one submission</text>
  <text class="c" x="1495" y="761">correlation_id</text>
</svg>
