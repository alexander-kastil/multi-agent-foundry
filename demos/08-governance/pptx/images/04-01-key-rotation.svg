<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Key rotation without downtime</title>
  <desc>The vault holds style-api-key-primary and style-api-key-secondary, both key-v1 before rotation. Step 1 writes key-v2 to the secondary. Step 2 disables the primary, and get_current_api_key falls back to the secondary and returns key-v2. Step 3 restores the primary with key-v2. Every read returns a valid key.</desc>
  <style>
    .hd { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 30px; fill: #24292f; text-anchor: middle; }
    .lh { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 32px; fill: #24292f; }
    .lc { font-family: Consolas, 'Courier New', monospace; font-size: 26px; fill: #57606a; }
    .v { font-family: Consolas, 'Courier New', monospace; font-weight: 700; font-size: 36px; fill: #24292f; text-anchor: middle; }
    .s { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 26px; fill: #57606a; text-anchor: middle; }
    .bt { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 30px; fill: #24292f; text-anchor: middle; }
    .ok { fill: #e9f7ef; stroke: #8c959f; stroke-width: 2; }
    .chg { fill: #fff6e5; stroke: #e0a534; stroke-width: 2; }
    .off { fill: #fff6e5; stroke: #e0a534; stroke-width: 2; stroke-dasharray: 10 8; }
    .rule { stroke: #8c959f; stroke-width: 2; }
  </style>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="430" y="50" width="345" height="790" rx="20" fill="none" stroke="#e0a534" stroke-width="5">
    <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="discrete" values="430;795;1160;1525" keyTimes="0;0.25;0.5;0.75"/>
  </rect>

  <text class="hd" x="602" y="140">Before rotation</text>
  <text class="hd" x="967" y="120">1. Write the new</text>
  <text class="hd" x="967" y="158">secondary</text>
  <text class="hd" x="1332" y="120">2. Disable the</text>
  <text class="hd" x="1332" y="158">primary</text>
  <text class="hd" x="1697" y="120">3. Restore the</text>
  <text class="hd" x="1697" y="158">primary</text>

  <text class="lh" x="70" y="300">Primary</text>
  <text class="lc" x="70" y="344">style-api-key-primary</text>
  <rect class="ok" x="440" y="220" width="325" height="180" rx="16"/>
  <text class="v" x="602" y="300">key-v1</text>
  <text class="s" x="602" y="346">enabled</text>
  <rect class="ok" x="805" y="220" width="325" height="180" rx="16"/>
  <text class="v" x="967" y="300">key-v1</text>
  <text class="s" x="967" y="346">enabled</text>
  <rect class="off" x="1170" y="220" width="325" height="180" rx="16"/>
  <text class="v" x="1332" y="300">key-v1</text>
  <text class="s" x="1332" y="346">disabled</text>
  <rect class="chg" x="1535" y="220" width="325" height="180" rx="16"/>
  <text class="v" x="1697" y="300">key-v2</text>
  <text class="s" x="1697" y="346">enabled</text>

  <text class="lh" x="70" y="510">Secondary</text>
  <text class="lc" x="70" y="554">style-api-key-secondary</text>
  <rect class="ok" x="440" y="430" width="325" height="180" rx="16"/>
  <text class="v" x="602" y="510">key-v1</text>
  <text class="s" x="602" y="556">enabled</text>
  <rect class="chg" x="805" y="430" width="325" height="180" rx="16"/>
  <text class="v" x="967" y="510">key-v2</text>
  <text class="s" x="967" y="556">enabled</text>
  <rect class="ok" x="1170" y="430" width="325" height="180" rx="16"/>
  <text class="v" x="1332" y="510">key-v2</text>
  <text class="s" x="1332" y="556">enabled</text>
  <rect class="ok" x="1535" y="430" width="325" height="180" rx="16"/>
  <text class="v" x="1697" y="510">key-v2</text>
  <text class="s" x="1697" y="556">enabled</text>

  <line class="rule" x1="60" y1="640" x2="1860" y2="640"/>

  <text class="lh" x="70" y="730">Caller reads</text>
  <text class="lc" x="70" y="774">get_current_api_key</text>
  <rect class="ok" x="440" y="670" width="325" height="150" rx="16"/>
  <text class="v" x="602" y="738">key-v1</text>
  <text class="s" x="602" y="784">from the primary</text>
  <rect class="ok" x="805" y="670" width="325" height="150" rx="16"/>
  <text class="v" x="967" y="738">key-v1</text>
  <text class="s" x="967" y="784">from the primary</text>
  <rect class="ok" x="1170" y="670" width="325" height="150" rx="16"/>
  <text class="v" x="1332" y="738">key-v2</text>
  <text class="s" x="1332" y="784">from the secondary</text>
  <rect class="ok" x="1535" y="670" width="325" height="150" rx="16"/>
  <text class="v" x="1697" y="738">key-v2</text>
  <text class="s" x="1697" y="784">from the primary</text>

  <rect x="60" y="880" width="1800" height="140" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="bt" x="960" y="940">Every read returns a valid key</text>
  <text class="s" x="960" y="986">While the primary is disabled, the caller falls back to the secondary</text>
</svg>
