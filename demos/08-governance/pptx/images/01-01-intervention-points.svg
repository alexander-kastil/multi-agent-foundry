<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Intervention points in an agent run</title>
  <desc>A user sends a prompt to an agent, the agent calls a tool, the tool answers and the agent returns the output. A guardrail control can scan the content at four points on that path: user input (source Prompt), tool call (PreToolCall), tool response (PostToolCall) and output (Completion). Tool call and tool response apply to agents only and are in preview.</desc>
  <style>
    .h { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 32px; fill: #24292f; text-anchor: middle; }
    .hl { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #24292f; text-anchor: middle; }
    .b { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 26px; fill: #57606a; text-anchor: middle; }
    .bt { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 30px; fill: #24292f; text-anchor: middle; }
    .c { font-family: Consolas, 'Courier New', monospace; font-size: 28px; fill: #24292f; text-anchor: middle; }
    .cs { font-family: Consolas, 'Courier New', monospace; font-size: 26px; fill: #24292f; }
    .line { stroke: #8c959f; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 18 18" refX="17" refY="9" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="80" width="250" height="680" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="hl" x="185" y="395">User</text>
  <text class="b" x="185" y="448">sends the</text>
  <text class="b" x="185" y="482">prompt, gets</text>
  <text class="b" x="185" y="516">the output</text>

  <rect x="775" y="80" width="370" height="680" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="hl" x="960" y="395">Agent</text>
  <text class="b" x="960" y="448">uses the guardrail</text>
  <text class="b" x="960" y="482">set in its definition</text>
  <text class="c" x="960" y="524">rai_config</text>

  <rect x="1605" y="80" width="255" height="680" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="hl" x="1732" y="378">Tool</text>
  <text class="b" x="1732" y="430">with moderation</text>
  <text class="b" x="1732" y="464">support, such as</text>
  <text class="b" x="1732" y="498">OpenAPI or</text>
  <text class="b" x="1732" y="532">Azure AI Search</text>

  <rect x="390" y="80" width="310" height="250" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="2;7;2" keyTimes="0;0.0833;0.1667"/>
  </rect>
  <text class="h" x="545" y="158">User input</text>
  <text class="c" x="545" y="208">Prompt</text>
  <text class="b" x="545" y="258">models and agents</text>

  <rect x="1220" y="80" width="310" height="250" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="2;7;2" keyTimes="0;0.3333;0.4167"/>
  </rect>
  <text class="h" x="1375" y="158">Tool call</text>
  <text class="c" x="1375" y="208">PreToolCall</text>
  <text class="b" x="1375" y="258">agents only</text>
  <text class="b" x="1375" y="294">(preview)</text>

  <rect x="1220" y="510" width="310" height="250" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="2;7;2" keyTimes="0;0.5833;0.6667"/>
  </rect>
  <text class="h" x="1375" y="588">Tool response</text>
  <text class="c" x="1375" y="638">PostToolCall</text>
  <text class="b" x="1375" y="688">agents only</text>
  <text class="b" x="1375" y="724">(preview)</text>

  <rect x="390" y="510" width="310" height="250" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" dur="9s" repeatCount="indefinite" calcMode="discrete" values="2;7;2" keyTimes="0;0.8333;0.9167"/>
  </rect>
  <text class="h" x="545" y="588">Output</text>
  <text class="c" x="545" y="638">Completion</text>
  <text class="b" x="545" y="688">models and agents</text>

  <line class="line" x1="312" y1="205" x2="388" y2="205" marker-end="url(#arr)"/>
  <line class="line" x1="702" y1="205" x2="773" y2="205" marker-end="url(#arr)"/>
  <line class="line" x1="1147" y1="205" x2="1218" y2="205" marker-end="url(#arr)"/>
  <line class="line" x1="1532" y1="205" x2="1603" y2="205" marker-end="url(#arr)"/>
  <line class="line" x1="1603" y1="635" x2="1532" y2="635" marker-end="url(#arr)"/>
  <line class="line" x1="1218" y1="635" x2="1147" y2="635" marker-end="url(#arr)"/>
  <line class="line" x1="773" y1="635" x2="702" y2="635" marker-end="url(#arr)"/>
  <line class="line" x1="388" y1="635" x2="312" y2="635" marker-end="url(#arr)"/>

  <circle r="11" fill="#57606a" opacity="1">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 314 205 L 372 205" keyPoints="0;1;1" keyTimes="0;0.0833;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.0833"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 704 205 L 757 205" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.25;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1667;0.25"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 1149 205 L 1202 205" keyPoints="0;0;1;1" keyTimes="0;0.25;0.3333;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.3333"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 1534 205 L 1587 205" keyPoints="0;0;1;1" keyTimes="0;0.4167;0.5;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4167;0.5"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 1601 635 L 1548 635" keyPoints="0;0;1;1" keyTimes="0;0.5;0.5833;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.5833"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 1216 635 L 1163 635" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.75;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.75"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 771 635 L 718 635" keyPoints="0;0;1;1" keyTimes="0;0.75;0.8333;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.75;0.8333"/>
  </circle>
  <circle r="11" fill="#57606a" opacity="0">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 386 635 L 328 635" keyPoints="0;0;1" keyTimes="0;0.9167;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.9167"/>
  </circle>

  <rect x="60" y="840" width="1800" height="170" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="bt" x="960" y="912">Each control names a risk, an intervention point and an action</text>
  <text class="b" x="960" y="962">For agents the action is annotate and block. Each intervention point adds roughly 50 to 100 ms.</text>
</svg>
