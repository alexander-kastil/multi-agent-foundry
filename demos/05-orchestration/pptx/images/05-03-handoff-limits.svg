<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Handoff collaboration with turn limits</title>
  <desc>The task, ACME Corp's 10-K with 60 percent foreign revenue across Brazil, India and Turkey, goes to the start agent sec_filing_analyzer, which extracts financial metrics and has a turn limit of 2. Because foreign revenue is above 30 percent it hands off to international_risk_assessor, the terminal specialist for currency and geopolitical risk, also limited to 2 turns. The credit_analyst can hand off to the risk assessor on foreign currency obligations but did not speak in this run. The final message is JSON with currency_risk_score, hedging_recommendations and exposure_by_market. with_autonomous_mode lets the agents continue without a user message, and the turn limits stop the loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#8c959f"/>
    </marker>
    <style>
      .t { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #24292f; }
      .s { font-family: Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; }
      .m { font-family: Consolas, 'Courier New', monospace; fill: #24292f; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="380" y1="270" x2="478" y2="270"/>
    <line x1="1000" y1="300" x2="1258" y2="300"/>
    <line x1="1560" y1="420" x2="1560" y2="558"/>
    <line x1="1000" y1="600" x2="1299" y2="422" stroke-dasharray="12 10"/>
  </g>

  <rect x="60" y="150" width="320" height="250" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="90" y="205" font-size="28" font-weight="700">task</text>
  <text class="t" x="90" y="255" font-size="26">ACME Corp's 10-K</text>
  <text class="t" x="90" y="305" font-size="26">foreign revenue</text>
  <text class="t" x="90" y="341" font-size="26" font-weight="700">60 percent</text>
  <text class="s" x="90" y="377" font-size="26">Brazil, India, Turkey</text>

  <rect x="480" y="120" width="520" height="300" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="m" x="510" y="180" font-size="28" font-weight="700">sec_filing_analyzer</text>
  <text class="s" x="510" y="224" font-size="26">start agent</text>
  <text class="t" x="510" y="272" font-size="26">extracts financial metrics</text>
  <rect x="510" y="330" width="190" height="50" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text class="t" x="605" y="364" font-size="26" text-anchor="middle">turn limit: 2</text>

  <text class="t" x="1130" y="242" font-size="26" text-anchor="middle">foreign revenue</text>
  <text class="t" x="1130" y="276" font-size="26" text-anchor="middle">above 30 percent</text>

  <rect x="1260" y="120" width="600" height="300" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="m" x="1290" y="180" font-size="28" font-weight="700">international_risk_assessor</text>
  <text class="s" x="1290" y="224" font-size="26">terminal specialist</text>
  <text class="t" x="1290" y="272" font-size="26">currency and geopolitical risk</text>
  <rect x="1290" y="330" width="190" height="50" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text class="t" x="1385" y="364" font-size="26" text-anchor="middle">turn limit: 2</text>

  <rect x="480" y="560" width="520" height="280" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 10"/>
  <text class="m" x="510" y="620" font-size="28" font-weight="700">credit_analyst</text>
  <text class="t" x="510" y="670" font-size="26">debt structure and</text>
  <text class="t" x="510" y="706" font-size="26">credit metrics</text>
  <text class="s" x="510" y="780" font-size="26">did not speak in this run</text>

  <text class="s" x="1130" y="680" font-size="26" text-anchor="middle">foreign currency</text>
  <text class="s" x="1130" y="714" font-size="26" text-anchor="middle">obligations</text>

  <rect x="1260" y="560" width="600" height="280" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="1290" y="615" font-size="28" font-weight="700">Final message</text>
  <text class="t" x="1290" y="660" font-size="26">JSON with</text>
  <text class="m" x="1290" y="705" font-size="26">currency_risk_score</text>
  <text class="m" x="1290" y="745" font-size="26">hedging_recommendations</text>
  <text class="m" x="1290" y="785" font-size="26">exposure_by_market</text>

  <rect x="60" y="920" width="1800" height="90" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="90" y="975" font-size="26"><tspan class="m">with_autonomous_mode(turn_limits=...)</tspan>: agents continue without a user message, the limits stop the loop</text>

  <g fill="none" stroke="#e0a534" stroke-width="6">
    <rect x="472" y="112" width="536" height="316" rx="22" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1;0.3" values="0;1;0"/>
    </rect>
    <rect x="1252" y="112" width="616" height="316" rx="22" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.6" values="0;1;0"/>
    </rect>
    <rect x="1252" y="552" width="616" height="296" rx="22" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7" values="0;1"/>
    </rect>
  </g>

  <g fill="#e0a534" stroke="#ffffff" stroke-width="3">
    <circle r="13" cx="0" cy="0">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1" path="M380,270 L480,270"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1" values="1;0"/>
    </circle>
    <circle r="13" cx="0" cy="0" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.4;1" path="M1000,300 L1260,300"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3;0.4" values="0;1;0"/>
    </circle>
    <circle r="13" cx="0" cy="0" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.7;1" path="M1560,420 L1560,560"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;0.7" values="0;1;0"/>
    </circle>
  </g>
</svg>
