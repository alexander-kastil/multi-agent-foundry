<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The azd ai agent loop from scaffold to a monitored hosted agent</title>
  <desc>On your machine: step 1, azd ai agent init writes azure.yaml for an existing project; step 2, azd ai agent run starts the host on port 8088 with Agent Inspector on 8087, and azd ai agent invoke --local sends a message to the agent on localhost. In the Foundry project: step 3, azd deploy packages a ZIP, creates a version and waits until it is active; step 4, azd ai agent invoke calls the agent endpoint with your Entra token; step 5, azd ai agent monitor streams the container's console logs. An arrow loops back from monitor to run: the next azd deploy creates version 2. Step 6, azd ai agent doctor, runs local checks (extension, azure.yaml, environment, agent definition), an authentication check and remote checks (project reachable, your role, hosted agents active) and ends with 11 passed, 0 failed, 3 skipped. A highlight steps through the commands in this order.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8c959f"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="40" y="40" width="1380" height="440" rx="24" fill="#eaf2ff"/>
  <rect x="40" y="600" width="1380" height="440" rx="24" fill="#f3edff"/>
  <g font-size="28" font-weight="700" fill="#57606a">
    <text x="72" y="90">Your machine</text>
    <text x="72" y="650">Foundry project</text>
  </g>

  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="70" y="115" width="370" height="330" rx="18"/>
    <rect x="545" y="115" width="370" height="330" rx="18"/>
    <rect x="1020" y="115" width="370" height="330" rx="18"/>
    <rect x="70" y="675" width="370" height="330" rx="18"/>
    <rect x="545" y="675" width="370" height="330" rx="18"/>
    <rect x="1020" y="675" width="370" height="330" rx="18"/>
    <rect x="1480" y="115" width="400" height="890" rx="18"/>
  </g>
  <rect x="1508" y="800" width="344" height="124" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>

  <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="454" y1="280" x2="531" y2="280"/>
    <line x1="929" y1="280" x2="1006" y2="280"/>
    <line x1="1205" y1="459" x2="1205" y2="661"/>
    <line x1="1006" y1="840" x2="929" y2="840"/>
    <line x1="531" y1="840" x2="454" y2="840"/>
    <path d="M400 661 V540 H730 V459"/>
  </g>
  <text x="752" y="550" font-size="26" fill="#24292f">next <tspan font-family="Consolas, 'Courier New', monospace">azd deploy</tspan>: version 2</text>

  <g font-size="26" fill="#57606a">
    <text x="98" y="163">Step 1</text>
    <text x="573" y="163">Step 2</text>
    <text x="1048" y="163">Step 2</text>
    <text x="1048" y="723">Step 3</text>
    <text x="573" y="723">Step 4</text>
    <text x="98" y="723">Step 5</text>
    <text x="1508" y="163">Step 6</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#57606a">
    <text x="98" y="215">azd ai agent</text>
    <text x="573" y="215">azd ai agent</text>
    <text x="1048" y="215">azd ai agent</text>
    <text x="1048" y="775">azd</text>
    <text x="573" y="775">azd ai agent</text>
    <text x="98" y="775">azd ai agent</text>
    <text x="1508" y="215">azd ai agent</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="36" font-weight="700" fill="#24292f">
    <text x="98" y="263">init</text>
    <text x="573" y="263">run</text>
    <text x="1048" y="263">invoke --local</text>
    <text x="1048" y="823">deploy</text>
    <text x="573" y="823">invoke</text>
    <text x="98" y="823">monitor</text>
    <text x="1508" y="263">doctor</text>
  </g>
  <g font-size="26" fill="#24292f">
    <text x="98" y="330">writes <tspan font-family="Consolas, 'Courier New', monospace">azure.yaml</tspan></text>
    <text x="98" y="368">for an existing project</text>
    <text x="573" y="330">starts the host on 8088,</text>
    <text x="573" y="368">Agent Inspector on 8087</text>
    <text x="1048" y="330">sends a message to the</text>
    <text x="1048" y="368">agent on localhost</text>
    <text x="1048" y="890">packages a ZIP, creates</text>
    <text x="1048" y="928">a version, waits until</text>
    <text x="1048" y="966">it is active</text>
    <text x="573" y="890">calls the agent endpoint</text>
    <text x="573" y="928">with your Entra token</text>
    <text x="98" y="890">streams the container's</text>
    <text x="98" y="928">console logs</text>
  </g>

  <g fill="#24292f">
    <text x="1508" y="335" font-size="28" font-weight="700">Local</text>
    <text x="1508" y="375" font-size="26">extension, <tspan font-family="Consolas, 'Courier New', monospace">azure.yaml</tspan>,</text>
    <text x="1508" y="411" font-size="26">environment, agent</text>
    <text x="1508" y="447" font-size="26">definition</text>
    <text x="1508" y="530" font-size="28" font-weight="700">Authentication</text>
    <text x="1508" y="615" font-size="28" font-weight="700">Remote</text>
    <text x="1508" y="655" font-size="26">project reachable, your</text>
    <text x="1508" y="691" font-size="26">role, hosted agents</text>
    <text x="1508" y="727" font-size="26">active</text>
    <text x="1534" y="852" font-size="26" font-family="Consolas, 'Courier New', monospace">11 passed, 0 failed,</text>
    <text x="1534" y="892" font-size="26" font-family="Consolas, 'Courier New', monospace">3 skipped</text>
  </g>

  <g fill="none" stroke="#e0a534" stroke-width="6">
    <rect x="62" y="107" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.1429" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="537" y="107" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1429;0.2857" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="1012" y="107" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2857;0.4286" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="1012" y="667" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4286;0.5714" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="537" y="667" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5714;0.7143" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="62" y="667" width="386" height="346" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7143;0.8571" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="1472" y="107" width="416" height="906" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.8571" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
