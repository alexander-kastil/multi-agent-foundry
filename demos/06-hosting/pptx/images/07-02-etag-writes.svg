<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Two agents write one shared document with an etag guard</title>
  <desc>Sequence of two of the four agents in lab Step 2, market-analysis-v2 and risk-v1, writing the shared document acme-retirement:tech-analysis. Both read the document with _etag 1. market-analysis-v2 replaces it with etag 1, the store accepts the write, the etag becomes 2 and an invalidation message is published. risk-v1 then replaces with the stale etag 1 and gets 412 Precondition Failed. It reads again without the cache, gets _etag 2, replaces with etag 2 on its second attempt, the store accepts, the etag becomes 3 and a second invalidation message is published. The animation moves a dot along each message in order.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="110" y="70" width="440" height="130" rx="20" fill="#eaf2ff"/>
    <rect x="690" y="70" width="540" height="130" rx="20" fill="#fff6e5" stroke="#e0a534"/>
    <rect x="1370" y="70" width="440" height="130" rx="20" fill="#eaf2ff"/>
  </g>
  <g text-anchor="middle">
    <text x="330" y="126" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">market-analysis-v2</text>
    <text x="330" y="172" font-size="26" fill="#57606a">agent</text>
    <text x="960" y="126" font-size="28" font-weight="700" fill="#24292f">Shared document</text>
    <text x="960" y="172" font-size="26" font-family="Consolas, monospace" fill="#24292f">acme-retirement:tech-analysis</text>
    <text x="1590" y="126" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">risk-v1</text>
    <text x="1590" y="172" font-size="26" fill="#57606a">agent</text>
  </g>
  <g stroke="#8c959f" stroke-width="2" stroke-dasharray="8 8">
    <line x1="330" y1="200" x2="330" y2="1030"/>
    <line x1="960" y1="200" x2="960" y2="1030"/>
    <line x1="1590" y1="200" x2="1590" y2="1030"/>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="332" y1="280" x2="950" y2="280"/>
    <line x1="1588" y1="280" x2="970" y2="280"/>
    <line x1="332" y1="440" x2="950" y2="440"/>
    <line x1="1588" y1="600" x2="970" y2="600"/>
    <line x1="1588" y1="760" x2="970" y2="760"/>
    <line x1="1588" y1="920" x2="970" y2="920"/>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none" stroke-dasharray="12 8" marker-end="url(#a)">
    <line x1="958" y1="360" x2="340" y2="360"/>
    <line x1="962" y1="360" x2="1580" y2="360"/>
    <line x1="958" y1="520" x2="340" y2="520"/>
    <line x1="962" y1="680" x2="1580" y2="680"/>
    <line x1="962" y1="840" x2="1580" y2="840"/>
    <line x1="962" y1="1000" x2="1580" y2="1000"/>
  </g>
  <rect x="1124" y="634" width="302" height="40" rx="10" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <g fill="#24292f" font-size="26" text-anchor="middle">
    <text x="645" y="266">read</text>
    <text x="1275" y="266">read</text>
    <text x="645" y="346">document with <tspan font-family="Consolas, monospace">_etag 1</tspan></text>
    <text x="1275" y="346">document with <tspan font-family="Consolas, monospace">_etag 1</tspan></text>
    <text x="645" y="426">replace with etag 1</text>
    <text x="645" y="506">accepted, <tspan font-family="Consolas, monospace">_etag</tspan> is now 2</text>
    <text x="1275" y="586">replace with etag 1</text>
    <text x="1275" y="663" font-weight="700">412 Precondition Failed</text>
    <text x="1275" y="746">read again, skip the cache</text>
    <text x="1275" y="826">document with <tspan font-family="Consolas, monospace">_etag 2</tspan></text>
    <text x="1275" y="906">replace with etag 2</text>
    <text x="1275" y="986">accepted, <tspan font-family="Consolas, monospace">_etag</tspan> is now 3</text>
  </g>
  <g fill="#57606a" font-size="26">
    <text x="984" y="529">invalidation message published</text>
    <text x="936" y="1009" text-anchor="end">invalidation message published</text>
    <text x="310" y="449" text-anchor="end">attempt 1</text>
    <text x="1610" y="609">attempt 1</text>
    <text x="1610" y="929">attempt 2</text>
  </g>
  <g fill="#e0a534" stroke="#ffffff" stroke-width="2">
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0333;0.1;1" path="M332,280 L950,280"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0333;0.1"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0333;0.1;1" path="M1588,280 L970,280"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0333;0.1"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1208;0.1875;1" path="M958,360 L340,360"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1208;0.1875"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1208;0.1875;1" path="M962,360 L1580,360"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1208;0.1875"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2083;0.275;1" path="M332,440 L950,440"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2083;0.275"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2958;0.3625;1" path="M958,520 L340,520"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2958;0.3625"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3833;0.45;1" path="M1588,600 L970,600"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3833;0.45"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4708;0.5375;1" path="M962,680 L1580,680"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4708;0.5375"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5583;0.625;1" path="M1588,760 L970,760"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5583;0.625"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6458;0.7125;1" path="M962,840 L1580,840"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6458;0.7125"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7333;0.8;1" path="M1588,920 L970,920"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7333;0.8"/>
    </circle>
    <circle r="11" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8208;0.8875;1" path="M962,1000 L1580,1000"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8208;0.8875"/>
    </circle>
  </g>
</svg>
