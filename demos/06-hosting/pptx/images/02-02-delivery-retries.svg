<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a routine delivers a run: attempts, backoff and outcomes</title>
  <desc>Delivery makes up to five attempts, with exponential backoff of 5 to 60 seconds between attempts, so the gaps grow along the timeline. Each attempt has a 30 second timeout that covers acceptance of the background request. Three outcomes: when the request is accepted the run is completed, although the agent's own work may not be finished yet; HTTP 408, 429 or 5xx is retried after the backoff, up to five attempts in all; any other 4xx fails the run at once, without another attempt. A dot travels along the timeline at constant speed, so it takes longer to reach each later attempt, and each attempt lights up as the dot arrives.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8c959f"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="150" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Exponential backoff between attempts: 5 to 60 seconds</text>
  <path d="M270 212 V186 H1650 V212" fill="none" stroke="#8c959f" stroke-width="2"/>

  <g stroke="#8c959f" stroke-width="2" marker-end="url(#arr)">
    <line x1="336" y1="300" x2="384" y2="300"/>
    <line x1="516" y1="300" x2="644" y2="300"/>
    <line x1="776" y1="300" x2="1024" y2="300"/>
    <line x1="1156" y1="300" x2="1584" y2="300"/>
  </g>

  <circle r="14" fill="#e0a534" cx="270" cy="300">
    <animateMotion path="M0 0 H1380" keyPoints="0;1;1" keyTimes="0;0.8333;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <circle cx="270" cy="300" r="50"/>
    <circle cx="450" cy="300" r="50"/>
    <circle cx="710" cy="300" r="50"/>
    <circle cx="1090" cy="300" r="50"/>
    <circle cx="1650" cy="300" r="50"/>
  </g>
  <g font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="270" y="313">1</text>
    <text x="450" y="313">2</text>
    <text x="710" y="313">3</text>
    <text x="1090" y="313">4</text>
    <text x="1650" y="313">5</text>
  </g>
  <g font-size="26" fill="#57606a" text-anchor="middle">
    <text x="270" y="395">Attempt 1</text>
    <text x="450" y="395">Attempt 2</text>
    <text x="710" y="395">Attempt 3</text>
    <text x="1090" y="395">Attempt 4</text>
    <text x="1650" y="395">Attempt 5</text>
  </g>

  <g fill="none" stroke="#e0a534" stroke-width="6">
    <circle cx="270" cy="300" r="62" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.0833" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="300" r="62" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1087;0.192" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="300" r="62" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2657;0.349" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="300" r="62" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4952;0.5785" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="1650" cy="300" r="62" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.8333" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="200" y="470" width="1520" height="110" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="535" font-size="28" fill="#24292f" text-anchor="middle">Each attempt has a 30 second timeout that covers acceptance of the background request</text>

  <g stroke="#8c959f" stroke-width="2" marker-end="url(#arr)">
    <line x1="340" y1="582" x2="340" y2="676"/>
    <line x1="960" y1="582" x2="960" y2="676"/>
    <line x1="1580" y1="582" x2="1580" y2="676"/>
  </g>

  <g stroke="#8c959f" stroke-width="2">
    <rect x="60" y="680" width="560" height="300" rx="20" fill="#e9f7ef"/>
    <rect x="680" y="680" width="560" height="300" rx="20" fill="#fff6e5" stroke="#e0a534"/>
    <rect x="1300" y="680" width="560" height="300" rx="20" fill="#f6f8fa"/>
  </g>
  <g font-size="32" font-weight="700" fill="#24292f">
    <text x="92" y="750">Request accepted</text>
    <text x="712" y="750">HTTP 408, 429 or 5xx</text>
    <text x="1332" y="750">Any other 4xx</text>
  </g>
  <g font-size="26" fill="#24292f">
    <text x="92" y="808">the run is completed;</text>
    <text x="92" y="848">the agent's own work may</text>
    <text x="92" y="888">not be finished yet</text>
    <text x="712" y="808">retried after the backoff,</text>
    <text x="712" y="848">up to five attempts in all</text>
    <text x="1332" y="808">the run fails at once,</text>
    <text x="1332" y="848">without another attempt</text>
  </g>
</svg>
