<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The self-hosted Responses route in app.py</title>
  <desc>A caller sends input and temperature to POST /responses on your FastAPI server. responses_to_run converts the body into messages and options, your allowlist keeps only max_tokens, get_or_create_session loads the session by id from the SessionStore, and target.run runs the support-desk agent with the lookup_ticket tool against the Foundry model. set_session saves the session again, and responses_from_run converts the result into a Responses payload with a resp_ id for the caller. Framework helpers are grey, your code is blue, your policy is amber. A highlight follows the request through each step.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#24292f">

    <rect x="290" y="70" width="1350" height="890" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="320" y="122" font-size="28" font-weight="600">Your server <tspan font-weight="400" fill="#57606a">(FastAPI, </tspan><tspan font-weight="400" font-family="Consolas, Courier New, monospace" fill="#57606a">app.py</tspan><tspan font-weight="400" fill="#57606a">)</tspan>: <tspan font-family="Consolas, Courier New, monospace">POST /responses</tspan></text>

    <rect x="20" y="160" width="230" height="720" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="135" y="215" font-size="28" font-weight="600" text-anchor="middle">Caller</text>
    <text x="135" y="255" font-size="26" text-anchor="middle" fill="#57606a">OpenAI SDK</text>
    <text x="135" y="291" font-size="26" text-anchor="middle" fill="#57606a">or curl</text>
    <rect x="42" y="330" width="186" height="56" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="135" y="367" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">input</text>
    <rect x="42" y="402" width="186" height="56" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="135" y="439" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">temperature</text>
    <text x="135" y="500" font-size="26" text-anchor="middle" fill="#57606a">request</text>
    <rect x="42" y="732" width="186" height="56" rx="10" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="135" y="769" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">resp_...</text>
    <text x="135" y="830" font-size="26" text-anchor="middle" fill="#57606a">response</text>

    <rect x="315" y="160" width="300" height="180" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="465" y="225" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="600">responses_to_run</text>
    <text x="465" y="268" font-size="26" text-anchor="middle" fill="#57606a">body to messages</text>
    <text x="465" y="306" font-size="26" text-anchor="middle" fill="#57606a">and options</text>

    <rect x="655" y="160" width="300" height="180" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="805" y="222" font-size="28" text-anchor="middle" font-weight="600">Your allowlist</text>
    <text x="805" y="266" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">{"max_tokens"}</text>
    <text x="805" y="306" font-size="26" text-anchor="middle" fill="#57606a">only these reach the run</text>

    <rect x="995" y="160" width="340" height="180" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1165" y="222" font-size="28" text-anchor="middle" font-weight="600">Load the session</text>
    <text x="1165" y="266" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">get_or_create_session</text>
    <text x="1165" y="306" font-size="26" text-anchor="middle" fill="#57606a">by response or conv id</text>

    <rect x="995" y="430" width="340" height="180" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1165" y="490" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="600">SessionStore</text>
    <text x="1165" y="533" font-size="26" text-anchor="middle" fill="#57606a">in process by default,</text>
    <text x="1165" y="572" font-size="26" text-anchor="middle" fill="#57606a">or Redis, a database</text>

    <rect x="995" y="700" width="340" height="180" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1165" y="762" font-size="28" text-anchor="middle" font-weight="600">Save the session</text>
    <text x="1165" y="806" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">set_session</text>
    <text x="1165" y="846" font-size="26" text-anchor="middle" fill="#57606a">for the next turn</text>

    <rect x="315" y="700" width="300" height="180" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="465" y="765" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-weight="600">responses_from_run</text>
    <text x="465" y="808" font-size="26" text-anchor="middle" fill="#57606a">result to a</text>
    <text x="465" y="846" font-size="26" text-anchor="middle" fill="#57606a">Responses payload</text>

    <rect x="1375" y="160" width="240" height="720" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1495" y="222" font-size="28" text-anchor="middle" font-weight="600">Agent run</text>
    <text x="1495" y="266" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">target.run</text>
    <text x="1495" y="420" font-size="26" text-anchor="middle" fill="#57606a">agent</text>
    <text x="1495" y="458" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">support-desk</text>
    <text x="1495" y="590" font-size="26" text-anchor="middle" fill="#57606a">tool runs here</text>
    <text x="1495" y="628" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">lookup_ticket</text>

    <rect x="1680" y="400" width="220" height="240" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1790" y="476" font-size="28" text-anchor="middle" font-weight="600">Foundry</text>
    <text x="1790" y="516" font-size="26" text-anchor="middle" fill="#57606a">chat model</text>
    <text x="1790" y="568" font-size="26" text-anchor="middle" font-family="Consolas, Courier New, monospace">gpt-5.4</text>

    <g font-size="26">
      <rect x="330" y="440" width="36" height="36" rx="6" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
      <text x="382" y="468">your code</text>
      <rect x="640" y="440" width="36" height="36" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="692" y="468">framework helper</text>
      <rect x="330" y="530" width="36" height="36" rx="6" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
      <text x="382" y="558">your policy</text>
      <rect x="640" y="530" width="36" height="36" rx="6" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
      <text x="692" y="558">Foundry model</text>
    </g>

    <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#ah)">
      <line x1="250" y1="250" x2="313" y2="250"/>
      <line x1="615" y1="250" x2="653" y2="250"/>
      <line x1="955" y1="250" x2="993" y2="250"/>
      <line x1="1335" y1="250" x2="1373" y2="250"/>
      <line x1="1615" y1="520" x2="1678" y2="520" marker-start="url(#ah)"/>
      <line x1="1375" y1="790" x2="1337" y2="790"/>
      <line x1="995" y1="790" x2="617" y2="790"/>
      <line x1="315" y1="790" x2="252" y2="790"/>
    </g>
    <g stroke="#8c959f" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#ah)">
      <line x1="1165" y1="430" x2="1165" y2="342"/>
      <line x1="1165" y1="700" x2="1165" y2="612"/>
    </g>
    <text x="1180" y="395" font-size="26" fill="#57606a">load</text>
    <text x="1180" y="665" font-size="26" fill="#57606a">save</text>

    <g fill="none" stroke="#e0a534" stroke-width="8" stroke-opacity="0">
      <rect x="20" y="160" width="230" height="720" rx="14">
        <animate attributeName="stroke-opacity" values="1;0;1;0" keyTimes="0;0.1042;0.7708;0.875" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="315" y="160" width="300" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.1042;0.2083" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="655" y="160" width="300" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.2083;0.3125" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="995" y="160" width="340" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.3125;0.4167" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="995" y="430" width="340" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0;1;0" keyTimes="0;0.3125;0.4167;0.5625;0.6667" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="1375" y="160" width="240" height="720" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.4167;0.5625" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="1680" y="400" width="220" height="240" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.4167;0.5625" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="995" y="700" width="340" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.5625;0.6667" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="315" y="700" width="300" height="180" rx="14">
        <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.6667;0.7708" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
