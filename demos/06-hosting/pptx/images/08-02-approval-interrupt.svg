<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>An approval round trip as an AG-UI interrupt</title>
  <desc>Run run-1 on thread approval-1: the client posts Close ticket T-1001 as resolved, the server sends RUN_STARTED, TOOL_CALL_START for close_ticket and RUN_FINISHED with outcome interrupt and the message Approve running close_ticket. There is no TOOL_CALL_RESULT, so the tool has not run, and the run waits for the client. The client answers with the interrupt id, status resolved and payload approved true; approved false gives no tool result at all, and status cancelled abandons the run. Run run-2 on the same thread posts the messages from MESSAGES_SNAPSHOT plus the resume entry, and the server sends TOOL_CALL_RESULT Ticket T-1001 closed: Resolved, the text Closed ticket T-1001 as resolved, and RUN_FINISHED. The animation steps through the run, holds on the interrupt, then follows the answer into the second run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="70" y="96" font-size="28" fill="#24292f"><tspan font-family="Consolas, monospace" font-weight="700">run-1</tspan> on thread <tspan font-family="Consolas, monospace">approval-1</tspan></text>
  <rect x="70" y="120" width="450" height="160" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="570" y="120" width="220" height="160" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="840" y="120" width="360" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <rect x="1250" y="120" width="600" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <g font-size="26" fill="#24292f">
    <text x="96" y="173" font-family="Consolas, monospace" font-weight="700">POST</text>
    <text x="96" y="215">user: Close ticket</text>
    <text x="96" y="253">T-1001 as resolved</text>
    <text x="590" y="209" font-family="Consolas, monospace">RUN_STARTED</text>
    <text x="866" y="190" font-family="Consolas, monospace">TOOL_CALL_START</text>
    <text x="866" y="235" font-family="Consolas, monospace">close_ticket</text>
    <text x="1276" y="173" font-family="Consolas, monospace" font-weight="700">RUN_FINISHED</text>
    <text x="1276" y="215">outcome: <tspan font-family="Consolas, monospace">interrupt</tspan></text>
    <text x="1276" y="255" font-family="Consolas, monospace">"Approve running close_ticket?"</text>
  </g>
  <text x="840" y="335" font-size="26" fill="#57606a">no <tspan font-family="Consolas, monospace">TOOL_CALL_RESULT</tspan>: the tool has not run</text>
  <text x="1572" y="362" font-size="26" fill="#57606a">waits for the client</text>
  <rect x="1000" y="420" width="850" height="320" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1030" y="470" font-size="28" font-weight="700" fill="#24292f">The client answers</text>
  <g font-size="26" font-family="Consolas, monospace" fill="#24292f">
    <text x="1030" y="517">{"interruptId": "af-call-...",</text>
    <text x="1044" y="557">"status": "resolved",</text>
    <text x="1044" y="597">"payload": {"approved": true}}</text>
  </g>
  <line x1="1030" y1="627" x2="1820" y2="627" stroke="#8c959f" stroke-width="2"/>
  <g font-size="26" fill="#57606a">
    <text x="1030" y="670"><tspan font-family="Consolas, monospace" fill="#24292f">"approved": false</tspan>: no tool result at all</text>
    <text x="1030" y="712"><tspan font-family="Consolas, monospace" fill="#24292f">"status": "cancelled"</tspan>: the run is abandoned</text>
  </g>
  <text x="360" y="562" font-size="26" fill="#57606a">resume with the interrupt id</text>
  <text x="345" y="768" font-size="28" fill="#24292f"><tspan font-family="Consolas, monospace" font-weight="700">run-2</tspan> on the same thread</text>
  <rect x="70" y="790" width="490" height="190" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="610" y="790" width="520" height="190" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <rect x="1180" y="790" width="400" height="190" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1630" y="790" width="220" height="190" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <g font-size="26" fill="#24292f">
    <text x="96" y="842" font-family="Consolas, monospace" font-weight="700">POST</text>
    <text x="96" y="884">messages from <tspan font-family="Consolas, monospace">MESSAGES_SNAPSHOT</tspan></text>
    <text x="96" y="926">plus <tspan font-family="Consolas, monospace">resume: [decision]</tspan></text>
    <text x="636" y="850" font-family="Consolas, monospace">TOOL_CALL_RESULT</text>
    <text x="636" y="895">Ticket T-1001 closed:</text>
    <text x="636" y="935">Resolved</text>
    <text x="1206" y="850" font-family="Consolas, monospace">TEXT_MESSAGE_CONTENT</text>
    <text x="1206" y="895">Closed ticket T-1001</text>
    <text x="1206" y="935">as resolved.</text>
    <text x="1650" y="894" font-family="Consolas, monospace">RUN_FINISHED</text>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="520" y1="200" x2="566" y2="200"/>
    <line x1="790" y1="200" x2="836" y2="200"/>
    <line x1="1200" y1="200" x2="1246" y2="200"/>
    <line x1="1550" y1="280" x2="1550" y2="416"/>
    <path d="M1000,580 L315,580 L315,786"/>
    <line x1="560" y1="885" x2="606" y2="885"/>
    <line x1="1130" y1="885" x2="1176" y2="885"/>
    <line x1="1580" y1="885" x2="1626" y2="885"/>
  </g>
  <rect x="65" y="115" width="460" height="170" rx="22" fill="none" stroke="#e0a534" stroke-width="7">
    <animate attributeName="x" dur="12s" repeatCount="indefinite" calcMode="discrete" values="65;565;835;1245;995;65;605;1175;1625" keyTimes="0;0.1;0.1833;0.2667;0.5;0.6333;0.7167;0.8;0.8833"/>
    <animate attributeName="y" dur="12s" repeatCount="indefinite" calcMode="discrete" values="115;115;115;115;415;785;785;785;785" keyTimes="0;0.1;0.1833;0.2667;0.5;0.6333;0.7167;0.8;0.8833"/>
    <animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="discrete" values="460;230;370;610;860;500;530;410;230" keyTimes="0;0.1;0.1833;0.2667;0.5;0.6333;0.7167;0.8;0.8833"/>
    <animate attributeName="height" dur="12s" repeatCount="indefinite" calcMode="discrete" values="170;170;170;170;330;200;200;200;200" keyTimes="0;0.1;0.1833;0.2667;0.5;0.6333;0.7167;0.8;0.8833"/>
  </rect>
</svg>
