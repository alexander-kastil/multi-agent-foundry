<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Resilience layers around the lookup_drug_interaction tool</title>
  <desc>Nested layers of the Python server, outermost first. The MCP tool lookup_drug_interaction never raises and maps every failure to a result with a status. Inside it the circuit breaker circuit.call opens after 3 failed tool calls, then calls fail at once. Inside that the retry layer call_backend makes 3 attempts with a 200 ms base delay and jitter, for transient errors only. Inside that the router resolve_and_call picks the lowest p95 latency, a weighted canary, and skips unhealthy instances among drugs-east 1.0.0, drugs-west 1.0.0 and drugs-canary 1.1.0, which is unhealthy. In C# with Polly, AddCircuitBreaker comes before AddRetry because the first strategy added is the outermost. On the right, what the model receives: status ok when a healthy instance answered; status error with error_type invalid_input for a PermanentError, without retry; status unavailable with reason retries_exhausted and fallback consult_pharmacist after 3 attempts with TransientError; status unavailable with reason service_circuit_open and fallback consult_pharmacist when the circuit is open and the backend is not called.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="70" y="70" width="1080" height="810" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <rect x="110" y="185" width="1000" height="665" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <rect x="150" y="300" width="920" height="520" rx="18" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <rect x="190" y="415" width="840" height="375" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <g stroke="#8c959f" stroke-width="2" fill="#ffffff">
    <rect x="230" y="545" width="236" height="200" rx="14"/>
    <rect x="492" y="545" width="236" height="200" rx="14"/>
    <rect x="754" y="545" width="236" height="200" rx="14" stroke-dasharray="8 6"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">
    <text x="100" y="118">MCP tool</text>
    <text x="140" y="233">Circuit breaker</text>
    <text x="180" y="348">Retry with backoff</text>
    <text x="220" y="463">Router</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#24292f">
    <text x="250" y="118">lookup_drug_interaction</text>
    <text x="400" y="233">circuit.call</text>
    <text x="490" y="348">call_backend</text>
    <text x="340" y="463">resolve_and_call</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">
    <text x="100" y="160">never raises: maps every failure to a result with a status</text>
    <text x="140" y="275">opens after 3 failed tool calls; then calls fail at once</text>
    <text x="180" y="390">3 attempts, 200 ms base delay, jitter, transient errors only</text>
    <text x="220" y="505">lowest p95 latency, weighted canary, skips unhealthy</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#24292f" text-anchor="middle">
    <text x="348" y="615">drugs-east</text>
    <text x="610" y="615">drugs-west</text>
    <text x="872" y="615">drugs-canary</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a" text-anchor="middle">
    <text x="348" y="662">1.0.0</text>
    <text x="610" y="662">1.0.0</text>
    <text x="872" y="662">1.1.0</text>
    <text x="872" y="706">unhealthy</text>
  </g>

  <text x="70" y="940" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">C# with Polly: <tspan font-family="Consolas, 'Courier New', monospace" fill="#24292f">.AddCircuitBreaker(...)</tspan> before <tspan font-family="Consolas, 'Courier New', monospace" fill="#24292f">.AddRetry(...)</tspan></text>
  <text x="70" y="982" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">The first strategy added is the outermost.</text>

  <text x="1230" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#57606a">What the model receives</text>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="1230" y="125" width="610" height="110" rx="16" fill="#e9f7ef"/>
    <rect x="1230" y="265" width="610" height="150" rx="16" fill="#f6f8fa"/>
    <rect x="1230" y="445" width="610" height="190" rx="16" fill="#fff6e5" stroke="#e0a534"/>
    <rect x="1230" y="665" width="610" height="190" rx="16" fill="#fff6e5" stroke="#e0a534"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#24292f">
    <text x="1256" y="167">A healthy instance answered</text>
    <text x="1256" y="307">PermanentError, no retry</text>
    <text x="1256" y="487">TransientError after 3 attempts</text>
    <text x="1256" y="707">Circuit open, backend not called</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#24292f">
    <text x="1256" y="212">"status": "ok"</text>
    <text x="1256" y="352">"status": "error"</text>
    <text x="1256" y="394">"error_type": "invalid_input"</text>
    <text x="1256" y="532">"status": "unavailable"</text>
    <text x="1256" y="574">"reason": "retries_exhausted"</text>
    <text x="1256" y="616">"fallback": "consult_pharmacist"</text>
    <text x="1256" y="752">"status": "unavailable"</text>
    <text x="1256" y="794">"reason": "service_circuit_open"</text>
    <text x="1256" y="836">"fallback": "consult_pharmacist"</text>
  </g>

  <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="1156" y1="180" x2="1224" y2="180"/>
    <line x1="1156" y1="340" x2="1224" y2="340"/>
    <line x1="1156" y1="540" x2="1224" y2="540"/>
    <line x1="1156" y1="760" x2="1224" y2="760"/>
  </g>
</svg>
