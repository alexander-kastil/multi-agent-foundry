<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The six topics of the MCP module in order</title>
  <desc>Two rows of numbered topic cards read left to right. Build, debug and protect: 01 MCP Servers: Tools, Resources and Prompts, one HR server in C# and Python; 02 Transports and MCP Inspector Debugging, stdio versus Streamable HTTP; 03 MCP Authorization: OAuth 2.1 and PRM, Entra ID tokens, scopes and step-up. A connector leads from card 03 down to the second row. Host, harden and publish: 04 Hosting MCP on Azure Functions, MCP tool triggers on Flex Consumption; 05 MCP Resilience: Retry and Circuit Breaker, retry, circuit breaker and fallback; 06 Foundry Toolbox: Managed MCP Endpoints, publish tools once, promote versions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#57606a">
    <text x="90" y="170">Build, debug and protect</text>
    <text x="90" y="620">Host, harden and publish</text>
  </g>

  <g stroke="#8c959f" stroke-width="2">
    <rect x="90" y="200" width="550" height="280" rx="24" fill="#eaf2ff"/>
    <rect x="685" y="200" width="550" height="280" rx="24" fill="#eaf2ff"/>
    <rect x="1280" y="200" width="550" height="280" rx="24" fill="#eaf2ff"/>
    <rect x="90" y="650" width="550" height="280" rx="24" fill="#e9f7ef"/>
    <rect x="685" y="650" width="550" height="280" rx="24" fill="#e9f7ef"/>
    <rect x="1280" y="650" width="550" height="280" rx="24" fill="#e9f7ef"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#57606a" text-anchor="middle">
    <text x="365" y="270">01</text>
    <text x="960" y="270">02</text>
    <text x="1555" y="270">03</text>
    <text x="365" y="720">04</text>
    <text x="960" y="720">05</text>
    <text x="1555" y="720">06</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f" text-anchor="middle">
    <text x="365" y="335">MCP Servers: Tools,</text>
    <text x="365" y="377">Resources &amp; Prompts</text>
    <text x="960" y="335">Transports &amp; MCP</text>
    <text x="960" y="377">Inspector Debugging</text>
    <text x="1555" y="335">MCP Authorization:</text>
    <text x="1555" y="377">OAuth 2.1 &amp; PRM</text>
    <text x="365" y="785">Hosting MCP on</text>
    <text x="365" y="827">Azure Functions</text>
    <text x="960" y="785">MCP Resilience: Retry</text>
    <text x="960" y="827">&amp; Circuit Breaker</text>
    <text x="1555" y="785">Foundry Toolbox:</text>
    <text x="1555" y="827">Managed MCP Endpoints</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a" text-anchor="middle">
    <text x="365" y="440">One HR server in C# and Python</text>
    <text x="960" y="440">stdio versus Streamable HTTP</text>
    <text x="1555" y="440">Entra ID tokens, scopes and step-up</text>
    <text x="365" y="890">MCP tool triggers on Flex Consumption</text>
    <text x="960" y="890">Retry, circuit breaker and fallback</text>
    <text x="1555" y="890">Publish tools once, promote versions</text>
  </g>

  <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="644" y1="340" x2="680" y2="340"/>
    <line x1="1239" y1="340" x2="1275" y2="340"/>
    <line x1="644" y1="790" x2="680" y2="790"/>
    <line x1="1239" y1="790" x2="1275" y2="790"/>
    <path d="M1555,484 L1555,565 L560,565 L560,645"/>
  </g>
</svg>
