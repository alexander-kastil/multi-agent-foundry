<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-size="28">
  <title>Input tokens per loading stage, measured by run_progressive.py</title>
  <desc>Bar chart of input tokens per model call from three runs. Two runs send Say hello: an agent without skills uses 31 input tokens, and the same agent with the skills advertised uses 682, which covers the skill descriptions and the three skill tool definitions. One run asks for the hut quote and the cancellation rules and makes three model calls: 696 input tokens on call 1, 990 on call 2 after the loaded SKILL.md, and 1244 on call 3 after the policy, the template and the script result.</desc>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .m { font-family: Consolas, 'Courier New', monospace; }
    .s { fill: #57606a; }
    .b { font-weight: 600; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="250" y="112" class="s" font-size="26">input tokens per model call</text>

  <g stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 10">
    <line x1="250" y1="654.3" x2="1860" y2="654.3"/>
    <line x1="250" y1="448.6" x2="1860" y2="448.6"/>
    <line x1="250" y1="242.9" x2="1860" y2="242.9"/>
  </g>
  <line x1="250" y1="860" x2="1860" y2="860" stroke="#8c959f" stroke-width="2"/>
  <g font-size="26">
    <text x="230" y="869" class="s e" font-size="26">0</text>
    <text x="230" y="663" class="s e" font-size="26">400</text>
    <text x="230" y="458" class="s e" font-size="26">800</text>
    <text x="230" y="252" class="s e" font-size="26">1200</text>
  </g>

  <rect x="290" y="844.1" width="220" height="15.9" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <g fill="#fff6e5" stroke="#e0a534" stroke-width="3">
    <rect x="610" y="509.3" width="220" height="350.7"/>
    <rect x="1030" y="502.1" width="220" height="357.9"/>
    <rect x="1310" y="350.9" width="220" height="509.1"/>
    <rect x="1590" y="220.2" width="220" height="639.8"/>
  </g>

  <text x="400" y="826" class="b c" font-size="32">31</text>
  <text x="720" y="491" class="b c" font-size="32">682</text>
  <text x="1140" y="484" class="b c" font-size="32">696</text>
  <text x="1420" y="333" class="b c" font-size="32">990</text>
  <text x="1700" y="202" class="b c" font-size="32">1244</text>

  <text x="720" y="382" class="c">skill descriptions and</text>
  <text x="720" y="420" class="c">three tool definitions</text>
  <text x="1420" y="284" class="c">+ loaded <tspan class="m">SKILL.md</tspan></text>
  <text x="1700" y="110" class="c">+ policy, template</text>
  <text x="1700" y="148" class="c">and script result</text>

  <text x="400" y="904" class="c">without skills</text>
  <text x="720" y="904" class="c">advertise only</text>
  <text x="1140" y="904" class="c">model call 1</text>
  <text x="1420" y="904" class="c">model call 2</text>
  <text x="1700" y="904" class="c">model call 3</text>

  <g stroke="#57606a" stroke-width="2" fill="none">
    <path d="M290,928 V944 H830 V928"/>
    <path d="M1030,928 V944 H1810 V928"/>
  </g>
  <text x="560" y="990" class="s c" font-size="26">two runs: <tspan class="m">"Say hello."</tspan></text>
  <text x="1420" y="990" class="s c" font-size="26">one run: the hut quote and the cancellation rules</text>
</svg>
