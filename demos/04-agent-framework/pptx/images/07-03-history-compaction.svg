<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-size="28">
  <title>Input tokens per question with and without compaction</title>
  <desc>Line chart of the input tokens of six questions measured by run_compaction.py. With disable_compaction=True the count grows by about 940 tokens per question: 961, 1877, 2819, 3760, 4701 and 5639 on the last turn. With max_context_window_tokens=4000 and max_output_tokens=500 the first five turns are nearly the same, 961, 1875, 2814, 3753 and 4678, and the last turn falls to 2888 after the harness compacts the history.</desc>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .m { font-family: Consolas, 'Courier New', monospace; }
    .s { fill: #57606a; }
    .b { font-weight: 600; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="240" y="100" class="s e" font-size="26">input tokens</text>
  <g stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 10">
    <line x1="260" y1="646.7" x2="1500" y2="646.7"/>
    <line x1="260" y1="393.3" x2="1500" y2="393.3"/>
    <line x1="260" y1="140" x2="1500" y2="140"/>
  </g>
  <line x1="260" y1="900" x2="1500" y2="900" stroke="#8c959f" stroke-width="2"/>
  <text x="240" y="909" class="s e" font-size="26">0</text>
  <text x="240" y="656" class="s e" font-size="26">2000</text>
  <text x="240" y="402" class="s e" font-size="26">4000</text>
  <text x="240" y="149" class="s e" font-size="26">6000</text>

  <text x="340" y="945" class="s c" font-size="26">1</text>
  <text x="560" y="945" class="s c" font-size="26">2</text>
  <text x="780" y="945" class="s c" font-size="26">3</text>
  <text x="1000" y="945" class="s c" font-size="26">4</text>
  <text x="1220" y="945" class="s c" font-size="26">5</text>
  <text x="1440" y="945" class="s c" font-size="26">6</text>
  <text x="890" y="995" class="s c" font-size="26">question</text>

  <rect x="300" y="155" width="800" height="170" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <line x1="330" y1="200" x2="390" y2="200" stroke="#57606a" stroke-width="8"/>
  <text x="410" y="209" class="m" font-size="26">disable_compaction=True</text>
  <line x1="330" y1="256" x2="390" y2="256" stroke="#e0a534" stroke-width="8"/>
  <text x="410" y="265" class="m" font-size="26">max_context_window_tokens=4000,</text>
  <text x="410" y="301" class="m" font-size="26">max_output_tokens=500</text>

  <polyline points="340,778.3 560,662.2 780,542.9 1000,423.7 1220,304.5 1440,185.7" fill="none" stroke="#57606a" stroke-width="12" stroke-linejoin="round"/>
  <polyline points="340,778.3 560,662.5 780,543.6 1000,424.6 1220,307.4 1440,534.2" fill="none" stroke="#e0a534" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#57606a" stroke-width="4">
    <circle cx="1440" cy="185.7" r="11"/>
  </g>
  <g fill="#e0a534" stroke="#57606a" stroke-width="3">
    <circle cx="340" cy="778.3" r="10"/>
    <circle cx="560" cy="662.5" r="10"/>
    <circle cx="780" cy="543.6" r="10"/>
    <circle cx="1000" cy="424.6" r="10"/>
    <circle cx="1220" cy="307.4" r="10"/>
  </g>
  <circle cx="1440" cy="534.2" r="11" fill="#e0a534" stroke="#e0a534" stroke-width="3"/>

  <text x="360" y="500">about 940 more tokens</text>
  <text x="360" y="538">per question</text>

  <text x="1480" y="180" class="b">no compaction</text>
  <text x="1480" y="218" class="s" font-size="26">5639 on the last turn</text>
  <text x="1480" y="528" class="b">with compaction</text>
  <text x="1480" y="566" class="s" font-size="26">2888 on the last turn</text>
</svg>
