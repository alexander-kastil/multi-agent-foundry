<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Agent-level middleware wraps run-level middleware</title>
  <desc>Four middleware columns, A1 and A2 registered on the Agent and R1 and R2 passed to agent.run, followed by the agent TrailGuide. On the way in, the code before call_next runs in the order A1, A2, R1, R2, then the agent runs its model and tool calls. On the way out, the code after call_next runs in the order R2, R1, A2, A1. The printed lines match the tracer demo: an arrow right followed by the name on the way in, an arrow left followed by the name on the way out. A highlight steps through the halves in that order.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .s { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .m { font-family: Consolas, 'Courier New', monospace; fill: #24292f; }
      .sec { fill: #57606a; }
      .b { font-weight: 700; }
      .ln { stroke: #8c959f; stroke-width: 2; fill: none; }
      .col { fill: #fff6e5; stroke: #e0a534; stroke-width: 2; }
      .dv { stroke: #e0a534; stroke-width: 2; stroke-dasharray: 10 8; }
      .hl { fill: #e0a534; fill-opacity: 0.28; stroke: #e0a534; stroke-width: 6; }
    </style>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <text x="625" y="110" class="s b" font-size="30" text-anchor="middle">Agent level</text>
  <text x="625" y="152" class="m" font-size="26" text-anchor="middle">Agent(..., middleware=[A1, A2])</text>
  <text x="625" y="192" class="s sec" font-size="26" text-anchor="middle">policies that must always apply</text>
  <path d="M360,234 V216 H890 V234" class="ln"/>

  <text x="1225" y="110" class="s b" font-size="30" text-anchor="middle">Run level</text>
  <text x="1225" y="152" class="m" font-size="26" text-anchor="middle">agent.run(..., middleware=[R1, R2])</text>
  <text x="1225" y="192" class="s sec" font-size="26" text-anchor="middle">per-request behavior</text>
  <path d="M960,234 V216 H1490 V234" class="ln"/>

  <text x="300" y="420" class="s b" font-size="30" text-anchor="end">Way in</text>
  <text x="300" y="462" class="s sec" font-size="26" text-anchor="end">code before</text>
  <text x="300" y="500" class="m sec" font-size="26" text-anchor="end">call_next()</text>

  <text x="300" y="780" class="s b" font-size="30" text-anchor="end">Way out</text>
  <text x="300" y="822" class="s sec" font-size="26" text-anchor="end">code after</text>
  <text x="300" y="860" class="m sec" font-size="26" text-anchor="end">call_next()</text>

  <rect x="360" y="260" width="230" height="720" rx="16" class="col"/>
  <rect x="660" y="260" width="230" height="720" rx="16" class="col"/>
  <rect x="960" y="260" width="230" height="720" rx="16" class="col"/>
  <rect x="1260" y="260" width="230" height="720" rx="16" class="col"/>
  <rect x="1560" y="260" width="300" height="720" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>

  <rect x="360" y="260" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0833;0.1667" values="0;1;0"/>
  </rect>
  <rect x="660" y="260" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1667;0.25" values="0;1;0"/>
  </rect>
  <rect x="960" y="260" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.3333" values="0;1;0"/>
  </rect>
  <rect x="1260" y="260" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333;0.4167" values="0;1;0"/>
  </rect>
  <rect x="1560" y="260" width="300" height="720" rx="16" class="hl" style="fill:none" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4167;0.5" values="0;1;0"/>
  </rect>
  <rect x="1260" y="620" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.5833" values="0;1;0"/>
  </rect>
  <rect x="960" y="620" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5833;0.6667" values="0;1;0"/>
  </rect>
  <rect x="660" y="620" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6667;0.75" values="0;1;0"/>
  </rect>
  <rect x="360" y="620" width="230" height="360" rx="16" class="hl" opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.75;0.8333" values="0;1;0"/>
  </rect>

  <line x1="376" y1="626" x2="574" y2="626" class="dv"/>
  <line x1="676" y1="626" x2="874" y2="626" class="dv"/>
  <line x1="976" y1="626" x2="1174" y2="626" class="dv"/>
  <line x1="1276" y1="626" x2="1474" y2="626" class="dv"/>
  <text x="475" y="608" class="m sec" font-size="26" text-anchor="middle">call_next()</text>
  <text x="775" y="608" class="m sec" font-size="26" text-anchor="middle">call_next()</text>
  <text x="1075" y="608" class="m sec" font-size="26" text-anchor="middle">call_next()</text>
  <text x="1375" y="608" class="m sec" font-size="26" text-anchor="middle">call_next()</text>

  <text x="475" y="334" class="s b" font-size="40" text-anchor="middle">A1</text>
  <text x="775" y="334" class="s b" font-size="40" text-anchor="middle">A2</text>
  <text x="1075" y="334" class="s b" font-size="40" text-anchor="middle">R1</text>
  <text x="1375" y="334" class="s b" font-size="40" text-anchor="middle">R2</text>

  <text x="475" y="456" class="m" font-size="30" text-anchor="middle">-&gt; A1</text>
  <text x="775" y="456" class="m" font-size="30" text-anchor="middle">-&gt; A2</text>
  <text x="1075" y="456" class="m" font-size="30" text-anchor="middle">-&gt; R1</text>
  <text x="1375" y="456" class="m" font-size="30" text-anchor="middle">-&gt; R2</text>

  <text x="475" y="816" class="m" font-size="30" text-anchor="middle">&lt;- A1</text>
  <text x="775" y="816" class="m" font-size="30" text-anchor="middle">&lt;- A2</text>
  <text x="1075" y="816" class="m" font-size="30" text-anchor="middle">&lt;- R1</text>
  <text x="1375" y="816" class="m" font-size="30" text-anchor="middle">&lt;- R2</text>

  <text x="1710" y="580" class="s b" font-size="34" text-anchor="middle">the agent</text>
  <text x="1710" y="630" class="m" font-size="28" text-anchor="middle">TrailGuide</text>
  <text x="1710" y="680" class="s sec" font-size="26" text-anchor="middle">model and tool calls</text>

  <line x1="590" y1="446" x2="658" y2="446" class="ln" marker-end="url(#ah)"/>
  <line x1="890" y1="446" x2="958" y2="446" class="ln" marker-end="url(#ah)"/>
  <line x1="1190" y1="446" x2="1258" y2="446" class="ln" marker-end="url(#ah)"/>
  <line x1="1490" y1="446" x2="1558" y2="446" class="ln" marker-end="url(#ah)"/>

  <line x1="1560" y1="806" x2="1492" y2="806" class="ln" marker-end="url(#ah)"/>
  <line x1="1260" y1="806" x2="1192" y2="806" class="ln" marker-end="url(#ah)"/>
  <line x1="960" y1="806" x2="892" y2="806" class="ln" marker-end="url(#ah)"/>
  <line x1="660" y1="806" x2="592" y2="806" class="ln" marker-end="url(#ah)"/>
</svg>
