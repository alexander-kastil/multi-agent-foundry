<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The seven topics of module 7 in order</title>
  <desc>Top row, trace and score: 01 Tracing, OpenTelemetry and Application Insights; 02 Agent Evaluators, Task Adherence and Tools; 03 Evaluation Suites, Judges and Baselines; 04 Continuous Evaluation and AI Red Teaming. Bottom row, improve and respond: 05 Agent Optimizer, Instructions and Tool Tuning; 06 Performance and Cost, Routing and Caching; 07 Incident Response, Replay and Postmortem. A highlight steps through the topics in order.</desc>
