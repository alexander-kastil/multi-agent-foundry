  <text x="720" y="94" font-size="26" font-weight="700" fill="#24292f" text-anchor="middle">first-time buyer</text>
  <text x="560" y="172" font-size="26" fill="#57606a" text-anchor="middle">none</text>
  <text x="720" y="156" font-size="26" fill="#57606a" text-anchor="middle">vague</text>
  <text x="720" y="190" font-size="26" fill="#57606a" text-anchor="middle">request</text>
  <text x="880" y="156" font-size="26" fill="#57606a" text-anchor="middle">policy</text>
  <text x="880" y="190" font-size="26" fill="#57606a" text-anchor="middle">edge case</text>
