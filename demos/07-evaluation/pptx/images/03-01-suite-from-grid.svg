<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>An evaluation suite generated from a grid</title>
  <desc>Three interaction categories, refund_calculation, returns_processing and order_modification, crossed with two personas, first-time buyer and premium repeat customer, and three adversarial conditions, none, vague request and policy edge case, give 18 cases, case-000 to case-017. The six cases with no adversarial condition are the canaries. Three historical probes from past incidents, probe-001 to probe-003, are appended to every full run, so the full run has 21 cases. Every case carries a ground truth; case-001 expects the agent to refund the amount actually paid, not the list price.</desc>
