<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Which evaluator catches which defect</title>
  <desc>The cloud run of eight evaluators over seven recorded refund runs. r1 correct passes every evaluator. Tool Selection passes r2 wrong_arguments, right tools with wrong values, and fails r3 wrong_tool. Tool Call Success fails only r4 tool_error, where the lookup returned a timeout. Task Completion passes r3 and r6 because their final answers read as finished work, so it should not gate on its own. Task Adherence fails every defective run, and the tool evaluators report n/a for r6 no_tool_call because there is no call to judge. Verdicts vary slightly between runs.</desc>
