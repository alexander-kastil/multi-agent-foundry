  <g font-size="30" font-weight="700" fill="#24292f">
    <text x="790" y="158">Result cache</text>
    <text x="790" y="388">Semantic cache</text>
    <text x="790" y="618">Router</text>
    <text x="1380" y="158">Result cache hits 1</text>
    <text x="1380" y="388">Semantic cache hits 1</text>
    <text x="1380" y="618">Quality floor</text>
    <text x="790" y="855">Tier 1</text>
    <text x="1183" y="855">Tier 2</text>
    <text x="1576" y="855">Tier 3</text>
  </g>
  <g font-size="26" fill="#57606a">
    <text x="790" y="208">exact normalized request</text>
    <text x="790" y="438">cosine similarity ≥ 0.85</text>
    <text x="1380" y="208">request 5 repeats request 1</text>
    <text x="1380" y="438">request 6 at similarity 0.86</text>
    <text x="1380" y="668">below the floor: retry one tier up</text>
    <text x="790" y="948">quality floor 75</text>
    <text x="1183" y="948">quality floor 85</text>
    <text x="1576" y="948">quality floor 60</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="26" fill="#24292f">
    <text x="790" y="668">classify_complexity</text>
    <text x="790" y="902">gpt-5-mini</text>
    <text x="1183" y="902">gpt-5.4</text>
    <text x="1576" y="902">gpt-5.2</text>
  </g>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="664" y1="170" x2="754" y2="170"/>
    <line x1="1254" y1="170" x2="1344" y2="170"/>
    <line x1="1254" y1="400" x2="1344" y2="400"/>
