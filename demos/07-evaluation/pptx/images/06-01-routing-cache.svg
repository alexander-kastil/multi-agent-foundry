    </rect>
    <rect x="752" y="552" width="506" height="156" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;1;1;1;0;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="752" y="792" width="329" height="206" rx="26" opacity="0">
