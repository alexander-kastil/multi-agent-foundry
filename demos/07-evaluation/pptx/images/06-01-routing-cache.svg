  </g>
  <g font-size="26" fill="#57606a">
    <text x="1299" y="155" text-anchor="middle">hit</text>
    <text x="1299" y="385" text-anchor="middle">hit</text>
    <text x="1022" y="293">miss</text>
    <text x="1022" y="523">miss</text>
    <text x="1113" y="878" text-anchor="middle">retry</text>
    <text x="1506" y="878" text-anchor="middle">retry</text>
  </g>

  <g fill="none" stroke="#e0a534" stroke-width="6">
    <rect x="52" y="92" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="1;0;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="52" y="238" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="52" y="384" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="52" y="530" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="52" y="676" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="52" y="822" width="616" height="144" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;0;0;1" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
    </rect>
    <rect x="1342" y="92" width="526" height="156" rx="26" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;0;1;0" keyTimes="0;0.1667;0.3333;0.5;0.6667;0.8333"/>
