    <text x="557" y="319">tier 1</text>
    <text x="557" y="465">tier 2</text>
    <text x="557" y="611">tier 3</text>
    <text x="557" y="757">result hit</text>
    <text x="557" y="903">semantic hit</text>
  </g>

