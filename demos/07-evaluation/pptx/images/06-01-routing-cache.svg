<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Six support requests through the result cache, the semantic cache and the router</title>
  <desc>Each request first meets the result cache, which matches the exact normalized request, then the semantic cache, which matches cosine similarity of at least 0.85, then the router, whose classify_complexity picks tier 1 gpt-5-mini, tier 2 gpt-5.4 or tier 3 gpt-5.2. An answer below its tier's quality floor retries one tier up. Requests 1 and 2 go to tier 1, request 3 to tier 2, request 4 to tier 3, request 5 is a result cache hit and request 6 a semantic cache hit at 0.86. A highlight follows each request in turn.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g stroke="#8c959f" stroke-width="2" fill="#f6f8fa">
    <rect x="60" y="100" width="600" height="128" rx="20"/>
    <rect x="60" y="246" width="600" height="128" rx="20"/>
    <rect x="60" y="392" width="600" height="128" rx="20"/>
    <rect x="60" y="538" width="600" height="128" rx="20"/>
    <rect x="60" y="684" width="600" height="128" rx="20"/>
    <rect x="60" y="830" width="600" height="128" rx="20"/>
  </g>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <circle cx="108" cy="164" r="26"/>
    <circle cx="108" cy="310" r="26"/>
    <circle cx="108" cy="456" r="26"/>
    <circle cx="108" cy="602" r="26"/>
    <circle cx="108" cy="748" r="26"/>
    <circle cx="108" cy="894" r="26"/>
  </g>
  <g text-anchor="middle" font-size="26" font-weight="700" fill="#24292f">
    <text x="108" y="173">1</text>
    <text x="108" y="319">2</text>
    <text x="108" y="465">3</text>
    <text x="108" y="611">4</text>
    <text x="108" y="757">5</text>
    <text x="108" y="903">6</text>
  </g>
  <g font-size="26" fill="#24292f">
    <text x="150" y="155">What is the status of</text>
    <text x="150" y="193">order #12345?</text>
    <text x="150" y="301">Where is order 12345</text>
    <text x="150" y="339">right now?</text>
    <text x="150" y="447">Which gift box suits a</text>
    <text x="150" y="485">vegan friend best: …</text>
    <text x="150" y="593">I want an exception to</text>
    <text x="150" y="631">your return policy …</text>
    <text x="150" y="739">What is the status of</text>
    <text x="150" y="777">order #12345?</text>
    <text x="150" y="885">what's the status of</text>
    <text x="150" y="923">my order 12345</text>
  </g>
  <g stroke="#8c959f" stroke-width="2">
    <rect x="470" y="142" width="175" height="44" rx="22" fill="#f3edff"/>
    <rect x="470" y="288" width="175" height="44" rx="22" fill="#f3edff"/>
    <rect x="470" y="434" width="175" height="44" rx="22" fill="#f3edff"/>
    <rect x="470" y="580" width="175" height="44" rx="22" fill="#f3edff"/>
    <rect x="470" y="726" width="175" height="44" rx="22" fill="#e9f7ef"/>
    <rect x="470" y="872" width="175" height="44" rx="22" fill="#e9f7ef"/>
