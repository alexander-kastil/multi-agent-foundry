    <rect x="760" y="330" width="490" height="140" rx="20" fill="#fff6e5" stroke="#e0a534"/>
    <rect x="760" y="560" width="490" height="140" rx="20" fill="#eaf2ff" stroke="#8c959f"/>
    <rect x="1350" y="100" width="510" height="140" rx="20" fill="#e9f7ef" stroke="#8c959f"/>
    <rect x="1350" y="330" width="510" height="140" rx="20" fill="#e9f7ef" stroke="#8c959f"/>
