<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The staged regression gate</title>
  <desc>A candidate prompt version runs the 6 canary cases first. Below a canary_min_rate of 0.8 the gate prints BLOCK - canary failure and exits with 1, before the expensive stage. Otherwise the full suite runs, 18 cases plus 3 historical probes, and the result is compared with baseline.json under the limits task_completion_drop 0.1, goal_achievement_drop 0.5 and per_type_drop 0.25. A drop past a limit blocks with BLOCK - quality regression detected; otherwise the gate prints APPROVE DEPLOYMENT and exits with 0. In the demo v1 reaches 100 percent on the canaries and every delta stays within its limit, while v2 reaches 33 percent on the canaries and the full suite never runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="360" y="78" width="76" height="46" rx="23" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="398" y="110" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">v1</text>
  <text x="456" y="111" font-size="28" fill="#24292f">canaries at 100%, all 21 cases run, every delta within its limit</text>

  <rect x="60" y="180" width="230" height="300" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="236" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Candidate</text>
  <rect x="105" y="270" width="140" height="60" rx="30" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="310" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">v1</text>
  <rect x="105" y="360" width="140" height="60" rx="30" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="400" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">v2</text>

  <rect x="360" y="180" width="340" height="300" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="530" y="240" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Canaries</text>
  <text x="530" y="294" font-size="26" fill="#24292f" text-anchor="middle">6 canary cases</text>
  <text x="530" y="356" font-size="26" fill="#57606a" text-anchor="middle">minimum completion</text>
  <text x="530" y="400" font-size="26" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">canary_min_rate 0.8</text>

  <rect x="770" y="180" width="340" height="300" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="940" y="240" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Full suite</text>
  <text x="940" y="294" font-size="26" fill="#24292f" text-anchor="middle">18 generated cases</text>
  <text x="940" y="336" font-size="26" fill="#24292f" text-anchor="middle">+ 3 historical probes</text>
  <text x="940" y="400" font-size="26" fill="#57606a" text-anchor="middle">21 cases in all</text>

  <rect x="1170" y="180" width="440" height="300" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1390" y="240" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Compare with baseline</text>
  <text x="1390" y="290" font-size="26" font-family="Consolas, Menlo, monospace" fill="#57606a" text-anchor="middle">baseline.json</text>
  <text x="1390" y="346" font-size="26" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">task_completion_drop 0.1</text>
  <text x="1390" y="388" font-size="26" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">goal_achievement_drop 0.5</text>
  <text x="1390" y="430" font-size="26" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">per_type_drop 0.25</text>

  <rect x="1680" y="180" width="180" height="300" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1770" y="300" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">APPROVE</text>
  <text x="1770" y="340" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">DEPLOYMENT</text>
  <text x="1770" y="400" font-size="26" fill="#57606a" text-anchor="middle">exit 0</text>

  <line x1="290" y1="330" x2="354" y2="330" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="330" x2="764" y2="330" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110" y1="330" x2="1164" y2="330" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1610" y1="330" x2="1674" y2="330" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="530" y1="480" x2="530" y2="614" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="556" font-size="26" fill="#57606a">below 0.8</text>
  <line x1="1390" y1="480" x2="1390" y2="614" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1412" y="556" font-size="26" fill="#57606a">a drop past its limit</text>

  <rect x="360" y="620" width="340" height="200" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="530" y="690" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">BLOCK - canary</text>
  <text x="530" y="730" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">failure</text>
  <text x="530" y="786" font-size="26" fill="#57606a" text-anchor="middle">exit 1</text>

  <rect x="1170" y="620" width="440" height="200" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="1390" y="690" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">BLOCK - quality</text>
  <text x="1390" y="730" font-size="26" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">regression detected</text>
  <text x="1390" y="786" font-size="26" fill="#57606a" text-anchor="middle">exit 1</text>

  <rect x="360" y="880" width="76" height="46" rx="23" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="398" y="912" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">v2</text>
  <text x="456" y="913" font-size="28" fill="#24292f">canaries at 33%, the full suite never runs</text>

  <rect x="98" y="263" width="154" height="74" rx="37" fill="none" stroke="#24292f" stroke-width="5" opacity="1">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1"/>
  </rect>
  <rect x="352" y="172" width="356" height="316" rx="20" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;1;0" keyTimes="0;0.1;0.2;0.7;0.8"/>
  </rect>
  <rect x="762" y="172" width="356" height="316" rx="20" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.3"/>
  </rect>
  <rect x="1162" y="172" width="456" height="316" rx="20" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3;0.4"/>
  </rect>
  <rect x="1672" y="172" width="196" height="316" rx="20" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.6"/>
  </rect>
  <rect x="98" y="353" width="154" height="74" rx="37" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6;0.7"/>
  </rect>
  <rect x="352" y="612" width="356" height="216" rx="20" fill="none" stroke="#24292f" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8"/>
  </rect>
</svg>
