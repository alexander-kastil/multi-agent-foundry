<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The same 20-turn history sent whole, trimmed and compacted</title>
  <desc>Three versions of the 20-turn weather history from the demo, each turn a user message, a function_call, a function_call_output and an assistant message. All 20 turns are 80 items and 11,322 input tokens, and the model answers with booking reference ZX-4417 and the sister Marta from turn 1. Trimmed to the last 4 turns the request has 16 items and 2,287 input tokens, turn 1 is gone and the model answers I don't know. Compacted with responses.compact the window keeps all 40 messages and one encrypted compaction item in place of the 40 tool items, 41 items, and the next turn costs 1,259 input tokens and still answers with ZX-4417 and Marta.</desc>
