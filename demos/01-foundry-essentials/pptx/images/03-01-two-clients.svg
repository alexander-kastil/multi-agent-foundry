<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The project client and its OpenAI-compatible client</title>
  <desc>PROJECT_ENDPOINT and DefaultAzureCredential configure AIProjectClient once. The project client handles Foundry-native operations with no OpenAI equivalent: deployments, connections, project properties and tracing. get_openai_client() in Python or GetProjectOpenAIClient() in C# hands out the OpenAI-compatible client for the Responses API, Chat Completions, conversations, agents, evaluations and model calls. Both reach the Foundry project through the one project endpoint.</desc>
  <style>
    svg { font-size: 28px; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .m { font-family: Consolas, 'Courier New', monospace; }
    .s { fill: #57606a; }
    .b { font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="380" width="480" height="300" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="114" y="436" class="b" font-size="30">Configured once</text>
  <text x="114" y="500" class="m" font-size="26">PROJECT_ENDPOINT</text>
  <text x="114" y="546" class="m" font-size="26">DefaultAzureCredential()</text>
  <text x="114" y="612" class="s" font-size="26">endpoint and identity</text>
  <text x="114" y="648" class="s" font-size="26">for both clients</text>
  <path d="M560,470 L672,330" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="680" y="100" width="580" height="370" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="970" y="158" text-anchor="middle" class="m b" font-size="32">AIProjectClient</text>
  <text x="970" y="198" text-anchor="middle" class="s" font-size="26">project client, Foundry-native</text>
  <path d="M700,222 H1240" stroke="#e0a534" stroke-width="2"/>
  <text x="970" y="268" text-anchor="middle" font-size="26">deployments</text>
  <text x="970" y="306" text-anchor="middle" font-size="26">connections</text>
  <text x="970" y="344" text-anchor="middle" font-size="26">project properties</text>
  <text x="970" y="382" text-anchor="middle" font-size="26">tracing</text>
  <text x="970" y="432" text-anchor="middle" class="s" font-size="26">no OpenAI equivalent</text>

  <path d="M970,470 V592" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="944" y="524" text-anchor="end" class="s" font-size="26">Python</text>
  <text x="996" y="524" class="m" font-size="26">get_openai_client()</text>
  <text x="944" y="562" text-anchor="end" class="s" font-size="26">C#</text>
  <text x="996" y="562" class="m" font-size="26">GetProjectOpenAIClient()</text>

  <rect x="680" y="600" width="580" height="400" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="970" y="654" text-anchor="middle" class="b" font-size="30">OpenAI-compatible client</text>
  <text x="970" y="692" text-anchor="middle" class="s" font-size="26">anything that follows OpenAI concepts</text>
  <path d="M700,716 H1240" stroke="#e0a534" stroke-width="2"/>
  <text x="970" y="760" text-anchor="middle" font-size="26">Responses API</text>
  <text x="970" y="798" text-anchor="middle" font-size="26">Chat Completions</text>
  <text x="970" y="836" text-anchor="middle" font-size="26">conversations</text>
  <text x="970" y="874" text-anchor="middle" font-size="26">agents</text>
  <text x="970" y="912" text-anchor="middle" font-size="26">evaluations</text>
  <text x="970" y="950" text-anchor="middle" font-size="26">model calls</text>

  <path d="M1260,285 L1392,420" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1260,800 L1392,640" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="1400" y="300" width="440" height="410" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1620" y="360" text-anchor="middle" class="b" font-size="30">Foundry project</text>
  <text x="1620" y="400" text-anchor="middle" class="s" font-size="26">one project endpoint</text>
  <text x="1620" y="470" text-anchor="middle" class="m" font-size="26">/api/projects/</text>
  <text x="1620" y="508" text-anchor="middle" class="m b" font-size="26">pro-code-agents</text>
  <path d="M1420,550 H1820" stroke="#8c959f" stroke-width="2"/>
  <text x="1620" y="610" text-anchor="middle" font-size="26">OpenAI-compatible calls</text>
  <text x="1620" y="650" text-anchor="middle" class="m" font-size="26">.../openai/v1/</text>
</svg>
