  <text x="1334" y="238" class="b" font-size="30">Foundry SDK &amp;</text>
  <text x="1334" y="278" class="b" font-size="30">Microsoft.Extensions.AI</text>
  <text x="1334" y="390" class="s" font-size="26">Project client, OpenAI-compatible</text>
