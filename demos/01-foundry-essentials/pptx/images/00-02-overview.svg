  <text x="714" y="238" class="b" font-size="30">Model Deployments &amp;</text>
  <text x="714" y="278" class="b" font-size="30">Model Router</text>
  <text x="714" y="390" class="s" font-size="26">Routing modes, model</text>
  <text x="714" y="426" class="s" font-size="26">subsets and failover</text>
  <rect x="1300" y="110" width="560" height="350" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
