  <rect x="60" y="620" width="560" height="350" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="94" y="690" class="b s" font-size="44">04</text>
  <text x="94" y="748" class="b" font-size="30">Responses API:</text>
  <text x="94" y="788" class="b" font-size="30">Conversations &amp; Streaming</text>
  <text x="94" y="900" class="s" font-size="26">Chained responses, conversations</text>
  <text x="94" y="936" class="s" font-size="26">and streaming events</text>
