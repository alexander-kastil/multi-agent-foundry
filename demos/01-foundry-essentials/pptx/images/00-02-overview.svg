<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The six topics of module 1 in order</title>
  <desc>Two rows of three numbered cards, read left to right, with a connector from card 03 down to card 04. 01 Microsoft Foundry: Projects and Resources, one project endpoint and the renamed Foundry roles. 02 Model Deployments and Model Router, routing modes, model subsets and failover. 03 Foundry SDK and Microsoft.Extensions.AI, project client, OpenAI-compatible client and IChatClient. 04 Responses API: Conversations and Streaming, chained responses, conversations and streaming events. 05 Foundry Toolkit and Foundry MCP Server, azd ai, Agent Inspector and the Foundry MCP server. 06 Context Engineering: Budgets, Compaction and Caching, measure, trim, compact and cache the context. A highlight steps through the cards in order.</desc>
  <style>
    svg { font-size: 28px; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .m { font-family: Consolas, 'Courier New', monospace; }
    .s { fill: #57606a; }
    .b { font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="110" width="560" height="350" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
