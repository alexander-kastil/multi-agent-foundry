<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>The Computer Use loop</title>
  <desc>The loop your application owns. The agent computer-agent on computer-use-preview proposes the next action as a computer_call. Your application reads the action, such as click, type, scroll or screenshot, and a sandbox, Playwright in a virtual machine with no access to sensitive data, executes it. Your code captures a new screenshot and sends it back as computer_call_output linked with previous_response_id. When the call carries pending_safety_checks, a person reviews the request and the next output sends acknowledged_safety_checks. The loop ends when the model stops asking for actions or the iteration limit is reached. A dot travels once around the loop per iteration.</desc>
  <style>
    svg { font-size: 26px; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sec { fill: #57606a; }
    .b { font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="700" y="60" width="520" height="120" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="730" y="110" class="sec">model stops asking for actions</text>
  <text x="730" y="150" class="sec">or the iteration limit is reached</text>

  <rect x="80" y="210" width="540" height="220" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="268" class="mono b" font-size="28">computer-agent</text>
  <text x="110" y="318" class="mono">computer-use-preview</text>
  <text x="110" y="378" class="sec">proposes the next action</text>

  <rect x="1300" y="210" width="540" height="220" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1330" y="268" class="b" font-size="28">Your application</text>
  <text x="1330" y="318" class="sec">reads the <tspan class="mono">computer_call</tspan></text>
  <text x="1330" y="358" class="sec">click, type, scroll</text>
  <text x="1330" y="396" class="sec">or screenshot</text>

  <rect x="700" y="470" width="520" height="190" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="730" y="522" class="mono b">pending_safety_checks</text>
  <text x="730" y="568" class="sec">a person reviews the request</text>
  <text x="730" y="618" class="mono">acknowledged_safety_checks</text>

  <rect x="1300" y="700" width="540" height="220" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1330" y="758" class="b" font-size="28">Sandbox</text>
  <text x="1330" y="808" class="sec">Playwright in a virtual machine</text>
  <text x="1330" y="848" class="sec">no access to sensitive data</text>
  <text x="1330" y="888" class="sec">executes the action</text>

  <rect x="80" y="700" width="540" height="220" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="758" class="mono b" font-size="28">computer_call_output</text>
  <text x="110" y="808" class="sec">the new screenshot</text>
  <text x="110" y="868" class="mono">previous_response_id</text>

  <line x1="620" y1="320" x2="1298" y2="320" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="302" text-anchor="middle" class="mono sec">computer_call</text>
  <line x1="1570" y1="430" x2="1570" y2="698" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1590" y="572" class="sec">execute</text>
  <line x1="1300" y1="810" x2="622" y2="810" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="850" text-anchor="middle" class="sec">capture a new screenshot</text>
  <line x1="350" y1="700" x2="350" y2="432" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="572" text-anchor="end" class="sec">send back</text>

  <path d="M520,210 V120 H698" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="430" x2="1222" y2="490" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="660" x2="622" y2="720" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="620" cy="320" r="12" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="620;1290;1290" keyTimes="0;0.24;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.25"/>
  </circle>
  <circle cx="1570" cy="430" r="12" fill="#e0a534" opacity="0">
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="430;430;690;690" keyTimes="0;0.25;0.49;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.5"/>
  </circle>
  <circle cx="1300" cy="810" r="12" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="1300;1300;630;630" keyTimes="0;0.5;0.74;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.75"/>
  </circle>
  <circle cx="350" cy="700" r="12" fill="#e0a534" opacity="0">
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="700;700;440;440" keyTimes="0;0.75;0.99;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.75"/>
  </circle>
</svg>
