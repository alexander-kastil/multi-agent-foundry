<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Continuing a conversation on version 2</title>
  <desc>A conversation stored on the server holds seven items in order. conversations.create seeds the first item, I bought the Trailhead 2 tent last week. Version 1 of m3-support-agent answers the next two questions, and version 2 answers the request to summarize, still knowing about the tent. A highlight steps through the items in order while a dot travels from the version that produced each answer.</desc>
  <style>
    svg { font-size: 26px; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sec { fill: #57606a; }
    .b { font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="14" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="200" width="460" height="100" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="241" class="mono b">conversations.create</text>
  <text x="110" y="281" class="sec">seeds the first item</text>

  <rect x="80" y="312" width="460" height="436" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="370" class="mono b" font-size="28">m3-support-agent:1</text>
  <text x="110" y="420" class="sec">Answer in one short sentence.</text>
  <text x="110" y="500" class="sec">each turn passes</text>
  <text x="110" y="540" class="mono">conversation.id</text>

  <rect x="80" y="760" width="460" height="212" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="815" class="mono b" font-size="28">m3-support-agent:2</text>
  <text x="110" y="858" class="sec">Answer in two short</text>
  <text x="110" y="893" class="sec">sentences and end with a</text>
  <text x="110" y="928" class="sec">follow-up question.</text>

  <rect x="600" y="110" width="1240" height="890" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="630" y="162" class="b" font-size="28">Conversation stored on the server</text>

  <rect x="630" y="200" width="1180" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="259" class="b sec">user</text>
  <text x="820" y="259">I bought the Trailhead 2 tent last week.</text>
  <text x="1780" y="259" text-anchor="end" class="sec">seeded item</text>

  <rect x="630" y="312" width="1180" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="371" class="b sec">user</text>
  <text x="820" y="371">Which tent did I buy?</text>

  <rect x="630" y="424" width="1180" height="100" rx="10" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="483" class="b sec">assistant</text>
  <text x="820" y="483">You bought the Trailhead 2 tent.</text>
  <text x="1780" y="483" text-anchor="end" class="sec">version 1</text>

  <rect x="630" y="536" width="1180" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="595" class="b sec">user</text>
  <text x="820" y="595">How long ago was that?</text>

  <rect x="630" y="648" width="1180" height="100" rx="10" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="707" class="b sec">assistant</text>
  <text x="820" y="707">You bought it one week ago.</text>
  <text x="1780" y="707" text-anchor="end" class="sec">version 1</text>

  <rect x="630" y="760" width="1180" height="100" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="819" class="b sec">user</text>
  <text x="820" y="819">Summarize what we discussed.</text>

  <rect x="630" y="872" width="1180" height="100" rx="10" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="660" y="931" class="b sec">assistant</text>
  <text x="820" y="914">You said you bought the Trailhead 2 tent last week,</text>
  <text x="820" y="950">and I confirmed it was the Trailhead 2. ...</text>
  <text x="1780" y="914" text-anchor="end" class="sec">version 2</text>

  <line x1="540" y1="250" x2="628" y2="250" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="474" x2="628" y2="474" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="698" x2="628" y2="698" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="922" x2="628" y2="922" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="625" y="195" width="1190" height="110" rx="14" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
    <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="discrete" values="195;307;419;531;643;755;867;867" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.875"/>
  </rect>

  <rect x="75" y="307" width="470" height="446" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.625"/>
  </rect>
  <rect x="75" y="755" width="470" height="222" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.625;0.875"/>
  </rect>

  <circle cx="540" cy="250" r="11" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="540;616;616" keyTimes="0;0.1;1"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.125"/>
  </circle>
  <circle cx="540" cy="474" r="11" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="540;540;616;616" keyTimes="0;0.25;0.35;1"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.375"/>
  </circle>
  <circle cx="540" cy="698" r="11" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="540;540;616;616" keyTimes="0;0.5;0.6;1"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.625"/>
  </circle>
  <circle cx="540" cy="922" r="11" fill="#e0a534" opacity="0">
    <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="540;540;616;616" keyTimes="0;0.75;0.85;1"/>
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.75;0.875"/>
  </circle>
</svg>
