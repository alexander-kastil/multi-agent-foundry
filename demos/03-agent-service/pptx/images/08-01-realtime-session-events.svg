    <circle r="11" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M1550,760 L370,760" keyPoints="0;0;1;1" keyTimes="0;0.7571;0.8143;1"/>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7571;0.8143"/>
    </circle>
  </g>
</svg>
