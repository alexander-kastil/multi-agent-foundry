      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M1550,590 L370,590" keyPoints="0;0;1;1" keyTimes="0;0.6;0.65;1"/>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6;0.65"/>
    </circle>
