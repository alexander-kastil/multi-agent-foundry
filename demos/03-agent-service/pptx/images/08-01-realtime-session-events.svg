      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6214;0.6714"/>
    </circle>
    <circle r="11" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M1550,590 L370,590" keyPoints="0;0;1;1" keyTimes="0;0.6429;0.6929;1"/>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6429;0.6929"/>
    </circle>
    <circle r="11" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M1550,675 L370,675" keyPoints="0;0;1;1" keyTimes="0;0.7;0.7571;1"/>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7;0.7571"/>
